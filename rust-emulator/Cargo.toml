[package]
name = "fm1-emu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Incremental pi32v2 interpreter for unchanged FM-1 application firmware"
default-run = "fm1-emu"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
# examples/speed.rs is built with --cfg fm1_fork against this fork and without it against upstream.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fm1_fork)'] }

[features]
gui = ["dep:eframe", "dep:cpal", "dep:ctrlc", "dep:rfd", "dep:windows-sys", "web"]
# The web editor bridge: a loopback HTTP/WebSocket server (src/web).
web = ["dep:tungstenite", "dep:zip"]

[[bin]]
name = "fm1-ui"
path = "src/ui.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.15", optional = true }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
zip = { version = "8.6", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
ctrlc = { version = "3", features = ["termination"], optional = true }
# The native open-file dialog (MIT). Its default features use the XDG desktop
# portal on Linux (no GTK needed) and the system dialogs on macOS and Windows.
rfd = { version = "0.17", optional = true }

# Re-attaching the parent console for the GUI binary on Windows (src/ui_console.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Console"] }
