[package]
name = "fm1-emu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Incremental pi32v2 interpreter for unchanged FM-1 application firmware"
default-run = "fm1-emu"

[features]
gui = ["dep:eframe", "dep:cpal"]

[[bin]]
name = "fm1-ui"
path = "src/ui.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.15", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
