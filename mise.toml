[tools]
rust = "1.91.1"
uv = "0.8.24"

[env]
UV_MANAGED_PYTHON = "1"
JIELI_TOOLCHAIN = "{{config_root}}/.deps/toolchain"
AC79_SDK = "{{config_root}}/.deps/sdk"

[tasks.setup]
description = "Fetch checksum-pinned vendor compiler and SDK files; install host dependencies"
run = ["uv sync --frozen", "uv run --frozen python tools/setup.py"]

[tasks.build]
description = "Build emulator probe and flashable minimal diagnostic firmware"
run = ["uv run --frozen python tools/build.py", "uv run --frozen python tools/build_diag.py", "uv run --frozen python tools/check_hardware.py build/fm1-diag.elf"]

[tasks.emulate]
description = "Run the CPU probe and save results and instruction trace"
run = "uv run --frozen python emu.py --output build/emulator.json --trace build/trace.jsonl"

[tasks.test]
description = "CPU, capture parser, and package integrity checks; no device access"
run = "uv run --frozen python -m unittest discover -s tests -v"

[tasks.ports]
description = "List USB serial ports"
run = "uv run --frozen python tools/capture.py --list"

[tasks.capture]
description = "Run the probe on a device: mise run capture -- SERIAL_PORT"
run = "uv run --frozen python tools/capture.py --output build/hardware.txt"

[tasks.compare]
description = "Compare emulator result with the captured device result"
depends = ["emulate"]
run = "uv run --frozen python tools/compare.py build/emulator.json build/hardware.txt"

[tasks.flash]
description = "Install build/fm1-diag.fwsc over USB MIDI; updater asks before writing"
run = "uv run --frozen python tools/fm1_install.py build/fm1-diag.fwsc"

[tasks.test-update]
description = "Simulate update staging and NOR writes; requires a host C compiler (cc)"
run = "uv run --frozen python tools/test_update.py"

[tasks.rust-test]
description = "Test the Rust CPU, firmware loader, and hardware probe agreement"
run = "cargo test --manifest-path rust-emulator/Cargo.toml --offline"

[tasks.build-foundation]
description = "Build separate firmware exercising emulator hardware foundations"
run = "uv run --frozen python tools/build_foundation.py"

[tasks.rust-foundation]
description = "Boot the five-foundation firmware with the OCT-minus matrix key pressed"
run = "cargo run --manifest-path rust-emulator/Cargo.toml --offline -- boot build/foundation/firmware.elf --until foundation_done --inspect foundation_results:10 --press 0:4"

[tasks.rust-probe]
description = "Execute the probe directly from the unchanged diagnostic ELF"
run = "cargo run --manifest-path rust-emulator/Cargo.toml --offline -- probe build/fm1-diag.elf"

[tasks.rust-boot]
description = "Start the diagnostic firmware and report the first emulation blocker"
run = "cargo run --manifest-path rust-emulator/Cargo.toml --offline -- boot build/fm1-diag.elf"

[tasks.build-display]
description = "Build flashable FM-1 display firmware shared with the emulator"
run = ["uv run --frozen python tools/build_display.py", "uv run --frozen python tools/check_hardware.py build/display/firmware.elf"]

[tasks.rust-gui-test]
description = "Test core emulation and graphical input, pause, restart, and fault behavior"
run = "cargo test --manifest-path rust-emulator/Cargo.toml --locked --offline --features gui"
